<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Checklist</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --primary: #0071e3;
            --primary-hover: #0077ed;
            --secondary: #f5a623;
            --danger: #ff3b30;
            --text: #1d1d1f;
            --text-muted: #86868b;
            --border: #d2d2d7;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
            padding-bottom: 100px;
            line-height: 1.5;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 24px; }
        header h1 {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Futura', 'Trebuchet MS', sans-serif;
            color: #000000;
        }
        .header-actions { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
        
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .list-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
        }
        .tab {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .tab:hover:not(.active) { background: var(--border); }
        
        .trip-info {
            background: linear-gradient(135deg, var(--card-bg), #f0f0f5);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .trip-info:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .trip-info h3 { color: var(--primary); margin-bottom: 4px; }
        .trip-info p { color: var(--text-muted); font-size: 14px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        
        .progress-container { margin-bottom: 16px; }
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 4px; transition: width 0.5s ease; }
        
        .section {
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(0,0,0,0.02);
            border-bottom: 1px solid var(--border);
        }
        .section-header h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .section-badge { background: var(--primary); color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .delete-section-btn { background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        
        .item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .item:last-child { border-bottom: none; }
        .item:hover { background: rgba(0,0,0,0.04); }
        .item.checked { opacity: 0.5; }
        .item.checked .item-name { text-decoration: line-through; }
        
        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-radius: 6px;
            margin-right: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .checkbox:hover { border-color: var(--primary); }
        .checkbox.checked {
            background: var(--primary);
            border-color: var(--primary);
        }
        .checkbox.checked::after { content: '✓'; color: white; font-weight: bold; font-size: 14px; }
        
        .item-name { flex: 1; font-size: 15px; }
        .item-qty {
            color: var(--text-muted);
            font-size: 13px;
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: var(--bg);
            margin: 0 10px;
            text-align: center;
            min-width: 70px;
            font-family: inherit;
        }
        .item-qty:focus { border-color: var(--primary); outline: none; }
        .item-qty[readonly] { background: transparent; border-color: transparent; }
        
        .delete-item-btn {
            background: transparent;
            color: var(--danger);
            border: none;
            font-size: 20px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 8px;
        }
        .item:hover .delete-item-btn { opacity: 1; }
        
        .add-item-row {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.02);
            flex-wrap: wrap;
        }
        .add-item-row input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            -webkit-appearance: none;
        }
        .add-item-row input:focus { border-color: var(--primary); outline: none; }
        .add-item-row input[type="text"] { flex: 2; min-width: 100px; }
        .add-item-row input[type="text]:last-of-type { flex: 1; max-width: 80px; }
        .add-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            transition: background 0.2s;
        }
        .add-btn:hover { background: var(--primary-hover); }
        
        .add-section-card {
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }
        .add-section-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 12px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
        }
        .add-section-card input:focus { border-color: var(--primary); outline: none; }
        
        .btn {
            padding: 12px 24px;
            border-radius: 20px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-ghost:hover { background: var(--border); }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-secondary:hover { background: var(--secondary-hover); }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal-content h2 { margin-bottom: 20px; font-size: 1.25rem; color: var(--primary); }
        .modal-content label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            -webkit-appearance: none;
        }
        .modal-content input:focus, .modal-content select:focus { border-color: var(--primary); outline: none; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons .btn { flex: 1; text-align: center; justify-content: center; }
        
        .summary-content {
            background: var(--bg);
            padding: 16px;
            border-radius: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stat-box:last-child { grid-column: span 2; }
            .item { padding: 10px 12px; }
        }
    </style>
</head>

    <div class="container">

        </header>

            <button class="btn btn-ghost" onclick="showSettingsModal()" style="background:#ffffff;color:#000000;border:1px solid #d2d2d7;font-size:12px;padding:8px 12px;">Settings</button>
        </div>

            <h3 id="tripDates">Trip Not Set</h3>
            <p id="tripDetails">Tap to configure your trip</p>
        </div>

        <div class="progress-container" id="progressContainer"></div>

        <div id="checklistContainer"></div>

        <div class="add-section-card" id="addSectionDiv">
            <input type="text" id="newSectionName" placeholder="New section name (e.g., Daypack Items)">
            <button class="btn btn-primary" onclick="addNewSection()" style="width:100%">+ Add Section</button>
        </div>
    </div>

<!-- Trip Modal -->
    <dialog id="tripModal" style="border:none;border-radius:24px;padding:28px;max-width:420px;width:90%;background:var(--card-bg);">

        <label style="color:var(--text-muted);">Destination</label>
        <input type="text" id="tripCountry" placeholder="e.g., Japan, France">
        <label style="color:var(--text-muted);">Start Date</label>
        <input type="date" id="tripStart">
        <label style="color:var(--text-muted);">End Date</label>
        <input type="date" id="tripEnd">
        <label style="color:var(--text-muted);">Notes</label>
        <input type="text" id="tripNotes" placeholder="e.g., 3 days hiking, 5 days city">
        <div style="display:flex;gap:12px;margin-top:20px;">
            <button class="btn btn-primary" onclick="saveTripInfo()">Save</button>
            <button class="btn btn-ghost" onclick="closeModal('tripModal')">Cancel</button>
        </div>
    </dialog>

    <!-- New List Modal -->
    <dialog id="newListModal" style="border:none;border-radius:24px;padding:28px;max-width:420px;width:90%;background:var(--card-bg);">
        <h2 style="color:var(--primary);">New List</h2>
        <label style="color:var(--text-muted);">List Name</label>
        <input type="text" id="newListName" placeholder="e.g., Europe Trip 2025">
        <label style="color:var(--text-muted);">Template</label>
        <select id="templateSelect">
            <option value="general">General Travel</option>
            <option value="beach">Beach Vacation</option>
            <option value="business">Business Trip</option>
            <option value="camping">Camping</option>
            <option value="empty">Empty List</option>
        </select>
        <div style="display:flex;gap:12px;margin-top:20px;">
            <button class="btn btn-primary" onclick="createNewList()">Create</button>
            <button class="btn btn-ghost" onclick="closeModal('newListModal')">Cancel</button>
        </div>
    </dialog>

    <!-- Summary Modal -->
    <dialog id="summaryModal" style="border:none;border-radius:24px;padding:28px;max-width:420px;width:90%;background:var(--card-bg);">
        <h2 style="color:var(--primary);">Trip Summary</h2>
        <div id="summaryContent" style="background:var(--bg);padding:16px;border-radius:16px;max-height:400px;overflow-y:auto;font-size:13px;"></div>
        <div style="display:flex;gap:12px;margin-top:20px;">
            <button class="btn btn-primary" onclick="copySummary()">Copy</button>
            <button class="btn btn-ghost" onclick="closeModal('summaryModal')">Close</button>
        </div>
    </dialog>

            renderListTabs();
            loadCurrentList();
        }

        function saveToHistory() {
            history.push(JSON.stringify(lists));
            if (history.length > MAX_HISTORY) history.shift();
        }

        function undo() {
            if (history.length === 0) { alert('Nothing to undo'); return; }
            lists = JSON.parse(history.pop());
            saveLists();
            renderListTabs();
            loadCurrentList();
        }

        function loadLists() {
            const saved = localStorage.getItem('travelChecklistLists');
            if (saved) {
                lists = JSON.parse(saved);
                if (lists.default && (lists.default.name === 'China Trip' || lists.default.name === 'Travel Checklist')) {
                    lists.default.name = 'Default Checklist';
                    saveLists();
                }
            } else {
                lists = { default: JSON.parse(JSON.stringify(templates.general)) };
                lists.default.name = 'Default Checklist';
                lists.default.isCustom = false;
                saveLists();
            }
            history = [];
        }

        function isListEditable() { return lists[currentListId].isCustom !== false; }
        function saveLists() { localStorage.setItem('travelChecklistLists', JSON.stringify(lists)); }

        function renderListTabs() {
            const container = document.getElementById('listSelector');
            container.innerHTML = '';
            Object.keys(lists).forEach(id => {
                const btn = document.createElement('button');
                btn.className = 'tab' + (id === currentListId ? ' active' : '');
                btn.textContent = lists[id].name;
                btn.onclick = () => switchList(id);
                container.appendChild(btn);
            });
        }

        function switchList(id) {
            currentListId = id;
            renderListTabs();
            loadCurrentList();
        }

        function loadCurrentList() {
            const list = lists[currentListId];
            
            if (list.trip) {
                document.getElementById('tripDates').textContent = `${list.trip.country || 'Trip to ' + (list.trip.start ? formatDate(list.trip.start) : 'Unnamed')}`;
                const dateRange = list.trip.start && list.trip.end ? `${formatDate(list.trip.start)} → ${formatDate(list.trip.end)}` : (list.trip.start ? formatDate(list.trip.start) : 'Dates not set');
                document.getElementById('tripDetails').textContent = dateRange + (list.trip.notes ? ' • ' + list.trip.notes : '');
            } else {
                document.getElementById('tripDates').textContent = 'Trip Not Set';
                document.getElementById('tripDetails').textContent = 'Tap to configure your trip';
            }

            document.getElementById('addSectionDiv').style.display = isListEditable() ? 'block' : 'none';
            renderProgress();
            renderChecklist();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function renderProgress() {
            const container = document.getElementById('progressContainer');
            const list = lists[currentListId];
            let total = 0, checked = 0;
            list.sections.forEach(s => s.items.forEach(i => { total++; if (i.checked) checked++; }));
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
            container.innerHTML = `
                <div class="progress-header">
                    <span>Packing Progress</span>
                    <span style="color:var(--primary)">${percent}% Complete</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
            `;
        }

        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';
            const list = lists[currentListId];
            const editable = isListEditable();

            list.sections.forEach((section, sIdx) => {
                const checkedInSection = section.items.filter(i => i.checked).length;
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';
                const canDelete = editable && !section.isDefault;
                sectionDiv.innerHTML = `
                    <div class="section-header">
                        <h2>${section.name} <span class="section-badge">${checkedInSection}/${section.items.length}</span></h2>
                        ${canDelete ? `<button class="delete-section-btn" onclick="deleteSection(${sIdx})">Delete</button>` : ''}
                    </div>
                `;

                section.items.forEach((item, iIdx) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `item ${item.checked ? 'checked' : ''}`;
                    itemDiv.innerHTML = `
                        <div class="checkbox ${item.checked ? 'checked' : ''}" onclick="toggleItem(${sIdx}, ${iIdx})"></div>
                        <span class="item-name">${item.name}</span>
                        <input type="text" class="item-qty" value="${item.qty}" ${!editable ? 'readonly' : ''} onchange="updateQty(${sIdx}, ${iIdx}, this.value)">
                        ${editable ? `<button class="delete-item-btn" onclick="deleteItem(${sIdx}, ${iIdx})">×</button>` : ''}
                    `;
                    sectionDiv.appendChild(itemDiv);
                });

                const addRow = document.createElement('div');
                addRow.className = 'add-item-row';
                addRow.innerHTML = `
                    <input type="text" id="newItemName_${sIdx}" placeholder="Item name">
                    <input type="text" id="newItemQty_${sIdx}" placeholder="Qty" style="width:70px">
                    <button class="add-btn" onclick="addItemToSection(${sIdx})">Add</button>
                `;
                sectionDiv.appendChild(addRow);
                container.appendChild(sectionDiv);
            });
        }

        function toggleItem(sIdx, iIdx) {
            saveToHistory();
            lists[currentListId].sections[sIdx].items[iIdx].checked = !lists[currentListId].sections[sIdx].items[iIdx].checked;
            saveLists();
            renderProgress();
            renderChecklist();
        }

        function updateQty(sIdx, iIdx, val) {
            saveToHistory();
            lists[currentListId].sections[sIdx].items[iIdx].qty = val;
            saveLists();
        }

        function addItemToSection(sIdx) {
            const name = document.getElementById(`newItemName_${sIdx}`).value.trim();
            const qty = document.getElementById(`newItemQty_${sIdx}`).value.trim() || '1';
            if (!name) return;
            saveToHistory();
            lists[currentListId].sections[sIdx].items.push({ name, qty, checked: false });
            saveLists();
            renderProgress();
            renderChecklist();
        }

        function deleteItem(sIdx, iIdx) {
            saveToHistory();
            lists[currentListId].sections[sIdx].items.splice(iIdx, 1);
            saveLists();
            renderProgress();
            renderChecklist();
        }

        function addNewSection() {
            const name = document.getElementById('newSectionName').value.trim();
            if (!name) return;
            saveToHistory();
            lists[currentListId].sections.push({ name, items: [], isDefault: false });
            document.getElementById('newSectionName').value = '';
            saveLists();
            renderProgress();
            renderChecklist();
        }

        function deleteSection(sIdx) {
            if (confirm('Delete this section and all items?')) {
                saveToHistory();
                lists[currentListId].sections.splice(sIdx, 1);
                saveLists();
                renderStats();
                renderProgress();
                renderChecklist();
            }
        }

        function generateSummary() {
            document.getElementById('settingsModal').style.display = 'none';
            const list = lists[currentListId];
            let total = 0, checked = 0, bySection = {};
            
            list.sections.forEach(s => {
                bySection[s.name] = { total: s.items.length, packed: 0, items: [] };
                s.items.forEach(i => {
                    total++;
                    if (i.checked) { checked++; bySection[s.name].packed++; }
                    bySection[s.name].items.push({ name: i.name, qty: i.qty, packed: i.checked });
                });
            });

            const trip = list.trip || {};
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
            const status = percent === 100 ? '✅ Fully Packed!' : percent > 50 ? '🧳 Well Underway' : '📝 Just Started';
            
            let summary = `# ${list.name} — ${trip.country || 'Travel'} Summary\n`;
            summary += `${'='.repeat(list.name.length + 15)}\n\n`;
            summary += `**Status:** ${status}\n`;
            summary += `**Progress:** ${checked}/${total} items packed (${percent}%)\n\n`;
            if (trip.start || trip.end) {
                summary += `**Trip:** ${trip.start || 'TBD'} → ${trip.end || 'TBD'}\n`;
                if (trip.notes) summary += `**Notes:** ${trip.notes}\n`;
                summary += '\n';
            }
            summary += `---\n\n## 📦 Packed Items (${checked})\n`;
            Object.entries(bySection).forEach(([sec, data]) => {
                const packed = data.items.filter(i => i.packed);
                if (packed.length > 0) {
                    summary += `\n### ${sec}\n`;
                    packed.forEach(i => summary += `- [x] ${i.name}${i.qty !== '1' ? ` (${i.qty})` : ''}\n`);
                }
            });
            const unpacked = total - checked;
            if (unpacked > 0) {
                summary += `\n---\n\n## ⬜ Still to Pack (${unpacked})\n`;
                Object.entries(bySection).forEach(([sec, data]) => {
                    const unp = data.items.filter(i => !i.packed);
                    if (unp.length > 0) {
                        summary += `\n### ${sec}\n`;
                        unp.forEach(i => summary += `- [ ] ${i.name}${i.qty !== '1' ? ` (${i.qty})` : ''}\n`);
                    }
                });
            }
            summary += `\n---\n*Generated on ${new Date().toLocaleDateString()}*\n`;
            
            currentSummary = summary;
            document.getElementById('summaryContent').textContent = summary;
            document.getElementById('summaryModal').style.display = 'flex';
        }

        function copySummary() {
            navigator.clipboard.writeText(currentSummary).then(() => alert('Summary copied!')).catch(() => {
                const ta = document.createElement('textarea'); ta.value = currentSummary;
                document.body.appendChild(ta); ta.select();
                document.execCommand('copy'); document.body.removeChild(ta);
                alert('Summary copied!');
            });
        }

function showTripModal() {
            const list = lists[currentListId];
            document.getElementById('tripCountry').value = list.trip?.country || '';
            document.getElementById('tripStart').value = list.trip?.start || '';
            document.getElementById('tripEnd').value = list.trip?.end || '';
            document.getElementById('tripModal').showModal();
        }

        function saveTripInfo() {
            saveToHistory();
            const start = document.getElementById('tripStart').value;
            const end = document.getElementById('tripEnd').value;
            lists[currentListId].trip = {
                country: document.getElementById('tripCountry').value,
                start: start,
                end: end,
                notes: document.getElementById('tripNotes').value
            };
            
            // Calculate trip days and update quantities
            if (start && end) {
                const startDate = new Date(start);
                const endDate = new Date(end);
                const tripDays = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
                
                // Update default quantities based on trip days
                lists[currentListId].sections.forEach(section => {
                    if (section.isDefault) {
                        section.items.forEach(item => {
                            if (item.name === 'T-shirts' || item.name === 'Underwear' || item.name === 'Socks') {
                                item.qty = tripDays;
                            } else if (item.name === 'Pants/Shorts') {
                                item.qty = Math.ceil(tripDays / 2);
                            } else if (item.name === 'Sleepwear') {
                                item.qty = Math.ceil(tripDays / 3);
                            }
                        });
                    }
                });
            }
            
            saveLists();
            document.getElementById('tripModal').close();
            loadCurrentList();
        }

        function showSettingsModal() { 
            document.getElementById('settingsModal').showModal(); 
        }

        function showNewListModal() {
            document.getElementById('newListModal').showModal();
            document.getElementById('settingsModal').close();
        }

        function createNewList() {
            const name = document.getElementById('newListName').value.trim();
            const template = document.getElementById('templateSelect').value;
            if (!name) { alert('Please enter a list name'); return; }
            if (!templates[template]) { alert('Template not found'); return; }
            const newId = 'list_' + Date.now();
            lists[newId] = JSON.parse(JSON.stringify(templates[template]));
            lists[newId].name = name;
            lists[newId].isCustom = true;
            
            // Update quantities based on trip dates if set
            if (lists[newId].trip && lists[newId].trip.start && lists[newId].trip.end) {
                const start = new Date(lists[newId].trip.start);
                const end = new Date(lists[newId].trip.end);
                const tripDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
                
                lists[newId].sections.forEach(section => {
                    if (section.isDefault || section.name.includes('Clothing')) {
                        section.items.forEach(item => {
                            if (item.name === 'T-shirts' || item.name === 'Underwear' || item.name === 'Socks') {
                                item.qty = tripDays;
                            } else if (item.name === 'Pants/Shorts') {
                                item.qty = Math.ceil(tripDays / 2);
                            } else if (item.name === 'Sleepwear') {
                                item.qty = Math.ceil(tripDays / 3);
                            }
                        });
                    }
                });
            }
            
            currentListId = newId;
            saveToHistory();
            saveLists();
            document.getElementById('newListModal').close();
            renderListTabs();
            loadCurrentList();
        }

function generateSummary() {

                summary += `\n---\n\n## Still to Pack (${unpacked})\n`;

                    const unp = data.items.filter(i => !i.packed);
                    if (unp.length > 0) {
                        summary += `\n### ${sec}\n`;
                        unp.forEach(i => summary += `- [ ] ${i.name}${i.qty !== '1' ? ` (${i.qty})` : ''}\n`);
                    }
                });
            }
            summary += `\n---\n*Generated on ${new Date().toLocaleDateString()}*\n`;
            
            currentSummary = summary;
            document.getElementById('summaryContent').textContent = summary;
            document.getElementById('summaryModal').showModal();
        }

        function copySummary() {
            navigator.clipboard.writeText(currentSummary).then(() => alert('Summary copied!')).catch(() => {
                const ta = document.createElement('textarea'); ta.value = currentSummary;
                document.body.appendChild(ta); ta.select();
                document.execCommand('copy'); document.body.removeChild(ta);
                alert('Summary copied!');
            });
        }

        function resetToDefaults() {
            document.getElementById('settingsModal').close();
            if (confirm('Reset all lists to defaults?')) {
                saveToHistory();
                lists = { default: JSON.parse(JSON.stringify(templates.general)) };
                currentListId = 'default';
                saveLists();
                renderListTabs();
                loadCurrentList();
            }
        }

        function closeModal(id) { 
            document.getElementById(id).close();
        }

        init();
    </script>
